name: Build agent installer

# Builds a Windows installer (.exe) for the agent whenever code under
# agent/ changes on main, or manually via the "Run workflow" button.
# The finished installer is uploaded as a downloadable build artifact,
# and also attached to a GitHub Release when you push a version tag
# like "v1.0.0".

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/build-installer.yml'
    tags:
      - 'v*'
  workflow_dispatch: {}

# Needed so softprops/action-gh-release can create a Release with the
# default GITHUB_TOKEN (without it: "Resource not accessible by integration").
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install agent dependencies
        working-directory: agent
        run: npm install

      - name: Package agent into a single .exe
        working-directory: agent
        run: npm run build

      # nssm.cc is a small hobby site that is sometimes down. The zip is cached
      # (keyed by the pinned build name), so once one build has downloaded it,
      # later builds never touch nssm.cc again.
      - name: Cache NSSM archive
        id: nssm-cache
        uses: actions/cache@v4
        with:
          path: agent/installer/nssm.zip
          key: nssm-2.24-101-g897c7ad

      - name: Download NSSM (Windows service wrapper)
        working-directory: agent/installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Using the 2.24-101 pre-release build, not the 2014 stable 2.24 -
          # nssm.cc itself recommends this build for Windows 10/Server 2016+
          # to avoid a known bug where the service fails to start.
          if (Test-Path "nssm.zip") {
            Write-Host "Using cached nssm.zip"
          } else {
            $headers = @{ "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) GitHubActionsCI" }
            # Primary source first, then a Wayback Machine copy of the same file
            # (the "id_" form returns the original bytes, not an HTML wrapper).
            $urls = @(
              "https://nssm.cc/ci/nssm-2.24-101-g897c7ad.zip",
              "https://web.archive.org/web/2024id_/https://nssm.cc/ci/nssm-2.24-101-g897c7ad.zip"
            )
            $ok = $false
            foreach ($attempt in 1..3) {
              foreach ($url in $urls) {
                try {
                  Invoke-WebRequest -Uri $url -OutFile "nssm.zip" -Headers $headers -TimeoutSec 90
                  # sanity check: a real zip starts with "PK"
                  $head = [System.IO.File]::ReadAllBytes("nssm.zip")[0..1]
                  if ($head[0] -eq 0x50 -and $head[1] -eq 0x4B) { $ok = $true; break }
                  Write-Host "Downloaded file from $url is not a zip - trying next source."
                } catch {
                  Write-Host "NSSM download failed from ${url} (attempt $attempt): $($_.Exception.Message)"
                }
              }
              if ($ok) { break }
              Start-Sleep -Seconds (10 * $attempt)
            }
            if (-not $ok) { Remove-Item "nssm.zip" -ErrorAction SilentlyContinue; Write-Error "Could not download NSSM from any source."; exit 1 }
          }

          Expand-Archive -Path "nssm.zip" -DestinationPath "nssm-extracted" -Force

          # Search recursively instead of assuming an exact folder name, in
          # case the archive's internal layout ever changes.
          $nssmExe = Get-ChildItem -Path "nssm-extracted" -Filter "nssm.exe" -Recurse |
            Where-Object { $_.FullName -like "*win64*" } |
            Select-Object -First 1

          if (-not $nssmExe) {
            Write-Error "Could not locate win64/nssm.exe inside the downloaded archive."
            Get-ChildItem -Path "nssm-extracted" -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          Copy-Item $nssmExe.FullName -Destination "nssm.exe" -Force
          Remove-Item "nssm-extracted" -Recurse -Force

          if (-not (Test-Path "nssm.exe")) {
            Write-Error "nssm.exe was not created after copy."
            exit 1
          }

          Write-Host "nssm.exe ready: $((Get-Item nssm.exe).Length) bytes"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer with Inno Setup
        working-directory: agent/installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Upload installer as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContentBlockerAgent-Setup
          path: dist-installer/ContentBlockerAgent-Setup.exe

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/ContentBlockerAgent-Setup.exe
