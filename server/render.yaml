# This deploys only the web service to Render. The database itself is
# Aiven Valkey/Redis (external), so it's NOT provisioned here - you connect
# to it via the REDIS_URL environment variable instead.

services:
  - type: web
    name: content-blocker-dashboard
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false        # set this yourself in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false        # paste the Aiven "Service URI" (starts with rediss://)
