<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דשבורד ניהול - חסימת תוכן</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="login-screen" class="screen">
  <div class="login-box">
    <h1>כניסה לניהול</h1>
    <input type="password" id="password-input" placeholder="סיסמת מנהל" />
    <button id="login-btn">כניסה</button>
    <p id="login-error" class="error"></p>
  </div>
</div>

<div id="dashboard-screen" class="screen hidden">
  <header>
    <h1>מחשבים מנוהלים</h1>
    <div class="header-actions">
      <button id="updates-report-btn" class="secondary">דוח עדכונים</button>
      <a id="download-btn" class="btn-link" href="/api/admin/installer" download>הורד את התוכנה</a>
      <button id="logout-btn" class="secondary">התנתק</button>
    </div>
  </header>
  <div id="version-summary" class="version-summary"></div>
  <div class="version-summary"><button id="update-all-btn" class="hidden">עדכן את כל המחשבים הלא עדכניים</button></div>

  <div class="toolbar">
    <input type="search" id="search-input" placeholder="חיפוש לפי מספר מחשב או שם..." autocomplete="off" />
    <span id="device-count" class="device-count"></span>
  </div>

  <div id="device-list"></div>

  <div id="removed-section" class="hidden">
    <h2 class="section-title">הוסרו לאחרונה</h2>
    <div id="removed-list"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
